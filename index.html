<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Cairo:wght@200..1000&family=Jomhuria&family=Jost:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,700;1,700&family=Red+Hat+Display:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="icon" href="images/favicon-32x32.png" />
    <title>Order summary</title>
  </head>
  <body>
    <div class="main">
      <div class="card">
        <img src="images/illustration-hero.svg" alt="" />
        <article>
          <h1>Order Summary</h1>
          <p>
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>
          <div>
            <div>
              <img src="images/icon-music.svg" alt="" />
              <div>
                <p>Annual Plan</p>
                <p>$59.99/year</p>
              </div>
            </div>
            <a href="#">Change</a>
          </div>
          <button>Proceed to Payment</button>
          <button>Cancel Order</button>
        </article>
      </div>
    </div>
  </body>
</html>
